: "CAUTION BATTERY SYSTEM CIRCUIT", "price": 0.6, "category": "Sticker label", "fullDesc": "CAUTION BATTERY SYSTEM CIRCUIT"}, {"sku": "SL-7075040300R", "name": "CAUTION PHOTOVOLTAIC POWER SOURCE", "price": 0.3, "category": "Sticker label", "fullDesc": "CAUTION PHOTOVOLTAIC POWER SOURCE"}, {"sku": "SL-7075040300RR", "name": "CAUTION: PHOTOVOLTAIC POWER SOURCE", "price": 0.6, "category": "Sticker label", "fullDesc": "CAUTION: PHOTOVOLTAIC POWER SOURCE"}];

const cart = {}; // sku -> {qty, notes}

function render(filter = '') {
  const list = document.getElementById('product-list');
  const q = filter.toLowerCase().trim();
  const filtered = PRODUCTS.filter(p => 
    !q || p.sku.toLowerCase().includes(q) || p.name.toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q)
  );
  document.getElementById('results-count').textContent = `${filtered.length} of ${PRODUCTS.length} products`;
  
  list.innerHTML = filtered.map(p => `
    <div class="product" data-sku="${p.sku}">
      <div class="sku">${p.sku}</div>
      <h3>${p.name}</h3>
      <div class="price">$${p.price.toFixed(2)} each</div>
      <div class="controls">
        <div class="qty-row">
          <button onclick="changeQty('${p.sku}', -1)">−</button>
          <input type="number" class="qty" value="${cart[p.sku]?.qty || 0}" min="0" onchange="setQty('${p.sku}', this.value)">
          <button onclick="changeQty('${p.sku}', 1)">+</button>
        </div>
      </div>
      <textarea class="notes" placeholder="Notes / special instructions" oninput="setNotes('${p.sku}', this.value)">${cart[p.sku]?.notes || ''}</textarea>
      <div class="line-total" id="line-${p.sku}">$0.00</div>
    </div>
  `).join('');
  updateTotals();
}

function changeQty(sku, delta) {
  if (!cart[sku]) cart[sku] = {qty: 0, notes: ''};
  cart[sku].qty = Math.max(0, cart[sku].qty + delta);
  const input = document.querySelector(`[data-sku="${sku}"] .qty`);
  if (input) input.value = cart[sku].qty;
  updateTotals();
}

function setQty(sku, val) {
  if (!cart[sku]) cart[sku] = {qty: 0, notes: ''};
  cart[sku].qty = Math.max(0, parseInt(val) || 0);
  updateTotals();
}

function setNotes(sku, val) {
  if (!cart[sku]) cart[sku] = {qty: 0, notes: ''};
  cart[sku].notes = val;
}

function updateTotals() {
  let grand = 0;
  PRODUCTS.forEach(p => {
    const item = cart[p.sku] || {qty: 0};
    const line = item.qty * p.price;
    grand += line;
    const el = document.getElementById('line-' + p.sku);
    if (el) el.textContent = '$' + line.toFixed(2);
  });
  document.getElementById('grand-total').textContent = '$' + grand.toFixed(2);
}

function generateOrderNum() {
  const d = new Date();
  const y = String(d.getFullYear()).slice(-2);
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  const rand = Math.floor(1000 + Math.random()*9000);
  return `APC-${y}${m}${day}-${rand}`;
}

function submitOrder() {
  const name = document.getElementById('cust-name').value.trim();
  const email = document.getElementById('cust-email').value.trim();
  if (!name || !email) { alert('Name and email required'); return; }
  
  const items = PRODUCTS.filter(p => (cart[p.sku]?.qty || 0) > 0).map(p => ({
    sku: p.sku,
    name: p.name,
    price: p.price,
    qty: cart[p.sku].qty,
    notes: cart[p.sku].notes || '',
    line: (cart[p.sku].qty * p.price).toFixed(2)
  }));
  
  if (!items.length) { alert('Add at least one item'); return; }
  
  const orderNum = generateOrderNum();
  const order = { orderNumber: orderNum, customer: {name, email, phone: document.getElementById('cust-phone').value, comments: document.getElementById('cust-comments').value}, items, total: document.getElementById('grand-total').textContent };
  console.log('ORDER:', order);
  document.getElementById('order-num').textContent = orderNum;
  document.getElementById('confirmation').style.display = 'block';
  alert('Order ' + orderNum + ' submitted (check console for full details). Email hookup comes next.');
}

document.getElementById('search').addEventListener('input', e => render(e.target.value));
render();
